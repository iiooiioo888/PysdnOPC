  responsibility: 自主人力資源架構師：獨立設計並建構組織的完整人員結構。負責分析任務需求、規劃團隊組成、建立與配置角色、驅動招募流程、管理員工生命週期（到職、評估、晉升、離職）、識別技能缺口、提出組織重組方案，並維護人才庫。主動運作，無需等待指令。
